<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>JeetCode — offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #FFFFFF; overflow: hidden; overscroll-behavior: none;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center;
        gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; pointer-events: none; }
      .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
        font-size: 13px; font-weight: 600; color: #3C4655; background: #F3F6FB; border: 1px solid #DDE3EC; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #D93025; }
      .pill.on .dot { background: #1E8E3E; }
      button { pointer-events: auto; border: 1px solid #1A73E8; border-radius: 999px; padding: 8px 18px; font-size: 13px;
        font-weight: 700; color: #1A73E8; background: #FFFFFF; font-family: inherit; }
      button.on { color: #FFFFFF; background: #1A73E8; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="bar">
      <span class="pill" id="pill"><span class="dot"></span><span id="ptxt">Offline</span></span>
      <button id="act">Retry</button>
    </div>
    <script>
      (function () {
        var BRAND = 'JeetCode';
        var BLUE = '#1A73E8';
        var INK = '#1F2328';
        var MUTED = '#6B7686';
        var WALL = '#2B3441';
        var RED = '#C5221F';
        var AMBER = '#FFB020';

        var embed = window.parent !== window;
        var fine = !!(window.matchMedia && window.matchMedia('(pointer: fine)').matches);
        var cv = document.getElementById('c');
        var ctx = cv.getContext('2d');
        var pill = document.getElementById('pill');
        var ptxt = document.getElementById('ptxt');
        var act = document.getElementById('act');
        var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

        var W = 0, H = 0, DPR = 1, U = 1;
        var state = 'ready'; // ready | play | over
        var jet = { x: 0, y: 0, tilt: 0 };
        var target = 0, keyDir = 0, down = false, grab = 0;
        var obs = [], parts = [], stars = [];
        var speed = 0, t = 0, dist = 0, score = 0, best = 0, newBest = false;
        var spawnT = 0.8, laneOff = 0, overAt = 0;

        try { best = parseInt(localStorage.getItem('jc-offline-best') || '0', 10) || 0; } catch (e) {}

        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          cv.width = Math.round(W * DPR);
          cv.height = Math.round(H * DPR);
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          U = Math.max(0.75, Math.min(W / 360, H / 640, 1.6));
          jet.y = H * 0.78;
          jet.x = clamp(jet.x || W / 2, 36 * U, W - 36 * U);
          target = jet.x;
          if (!stars.length) {
            for (var i = 0; i < 40; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, l: 8 + Math.random() * 28 });
          }
        }
        window.addEventListener('resize', resize);
        resize();

        function reset() {
          obs = []; parts = []; t = 0; dist = 0; score = 0; newBest = false; spawnT = 0.7;
          speed = U * 240;
          jet.x = W / 2; jet.tilt = 0; target = W / 2;
          state = 'play';
        }

        // Obstacle kinds unlock gradually: wall blocks and gap walls first, then pillars,
        // sliding blocks, pellet rows and finally spinning bars. Each one carries the brand name.
        function spawn() {
          var h = 32 * U;
          var crowded = obs.some(function (o) { return o.y < H * 0.25; });
          var pool = ['block', 'block', 'gap'];
          if (t > 5) pool.push('pillar');
          if (t > 8) pool.push('slider');
          if (t > 12) pool.push('pellets');
          if (t > 16) pool.push('spinner');
          var kind = crowded ? 'block' : pool[(Math.random() * pool.length) | 0];

          if (kind === 'gap') {
            var gap = Math.max(132, 172 - t * 0.7) * U;
            var gx = gap / 2 + 14 * U + Math.random() * (W - gap - 28 * U);
            obs.push({ y: -h - 4, h: h, color: WALL, segs: [
              { x: -4, w: gx - gap / 2 + 4 },
              { x: gx + gap / 2, w: W - (gx + gap / 2) + 4 }
            ] });
            return 1.6;
          }
          if (kind === 'pillar') {
            var pw = 54 * U, ph = (110 + Math.random() * 60) * U;
            obs.push({ y: -ph - 4, h: ph, color: WALL, segs: [{ x: Math.random() * (W - pw), w: pw, vert: true }] });
            return 1;
          }
          if (kind === 'slider') {
            var sw = Math.min(W * 0.4, (110 + Math.random() * 40) * U);
            obs.push({ y: -h - 4, h: h, color: RED,
              slide: { dir: Math.random() < 0.5 ? -1 : 1, v: (80 + Math.random() * 70) * U },
              segs: [{ x: Math.random() * (W - sw), w: sw }] });
            return 1;
          }
          if (kind === 'pellets') {
            var ps = 24 * U, segs = [];
            for (var i = 0; i < 4; i++) segs.push({ x: Math.random() * (W - ps), w: ps, dy: -i * 72 * U, nolabel: true });
            obs.push({ y: -ps - 4, h: ps, color: RED, segs: segs });
            return 1.3;
          }
          if (kind === 'spinner') {
            var len = Math.min(W * 0.5, (150 + Math.random() * 50) * U), th = 24 * U;
            obs.push({ kind: 'spin', y: -len / 2 - 4, x: len / 2 + 10 * U + Math.random() * (W - len - 20 * U),
              len: len, th: th, ang: Math.random() * 6.283,
              om: (Math.random() < 0.5 ? -1 : 1) * (1.4 + Math.random() * 0.6), ext: len / 2 + 40 * U });
            return 1.5;
          }
          var w = Math.min(W * 0.5, (130 + Math.random() * 110) * U);
          obs.push({ y: -h - 4, h: h, color: WALL, segs: [{ x: Math.random() * (W - w), w: w }] });
          return 1;
        }

        function circleRect(cx, cy, cr, rx, ry, rw, rh) {
          var nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
          var dx = cx - nx, dy = cy - ny;
          return dx * dx + dy * dy < cr * cr;
        }

        var HIT = [[0, -20, 6], [0, 0, 9], [0, 18, 9], [-19, 22, 6], [19, 22, 6]];
        function hit() {
          for (var i = 0; i < obs.length; i++) {
            var o = obs[i];
            for (var j = 0; j < HIT.length; j++) {
              var cx = jet.x + HIT[j][0] * U, cy = jet.y + HIT[j][1] * U, cr = HIT[j][2] * U;
              if (o.kind === 'spin') {
                var dx = cx - o.x, dy = cy - o.y, ca = Math.cos(o.ang), sa = Math.sin(o.ang);
                var lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca;
                if (circleRect(lx, ly, cr, -o.len / 2, -o.th / 2, o.len, o.th)) return true;
              } else {
                for (var s = 0; s < o.segs.length; s++) {
                  var g = o.segs[s];
                  if (circleRect(cx, cy, cr, g.x, o.y + (g.dy || 0), g.w, g.h || o.h)) return true;
                }
              }
            }
          }
          return false;
        }

        function crash() {
          state = 'over';
          overAt = performance.now();
          for (var i = 0; i < 24; i++) {
            var a = Math.random() * 6.283, sp = (60 + Math.random() * 220) * U;
            parts.push({ x: jet.x, y: jet.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.7 + Math.random() * 0.5, c: i % 3 ? BLUE : WALL });
          }
          if (score > best) {
            best = score; newBest = true;
            try { localStorage.setItem('jc-offline-best', String(best)); } catch (e) {}
          }
        }

        function update(dt) {
          var sp = state === 'play' ? speed : 160 * U;
          laneOff += sp * dt;
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            s.y += sp * (0.4 + s.l / 40) * dt;
            if (s.y > H + 30) { s.y = -30; s.x = Math.random() * W; }
          }
          if (state === 'play') {
            t += dt;
            speed = U * (240 + Math.min(t * 9, 380));
            dist += speed * dt;
            score = Math.floor(dist / (18 * U));
            if (keyDir) target += keyDir * 620 * U * dt;
            target = clamp(target, 36 * U, W - 36 * U);
            jet.x += (target - jet.x) * Math.min(1, 14 * dt);
            jet.tilt = clamp((target - jet.x) * 0.006, -0.4, 0.4);
            spawnT -= dt;
            if (spawnT <= 0) { spawnT = Math.max(0.42, 0.85 - t * 0.012) * (0.8 + Math.random() * 0.5) * spawn(); }
            for (var k = obs.length - 1; k >= 0; k--) {
              var ob = obs[k];
              ob.y += speed * dt;
              if (ob.slide) {
                var sg = ob.segs[0];
                sg.x += ob.slide.dir * ob.slide.v * dt;
                if (sg.x < 0) { sg.x = 0; ob.slide.dir = 1; }
                else if (sg.x + sg.w > W) { sg.x = W - sg.w; ob.slide.dir = -1; }
              }
              if (ob.kind === 'spin') ob.ang += ob.om * dt;
              if (ob.y > H + (ob.ext || 40)) obs.splice(k, 1);
            }
            if (hit()) crash();
          }
          for (var p = parts.length - 1; p >= 0; p--) {
            var q = parts[p];
            q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
            if (q.life <= 0) parts.splice(p, 1);
          }
        }

        function drawBg() {
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, W, H);
          ctx.lineCap = 'round';
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            ctx.strokeStyle = 'rgba(26,115,232,' + (0.05 + s.l / 300) + ')';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + s.l * (state === 'play' ? 1 : 0.5)); ctx.stroke();
          }
          ctx.strokeStyle = '#E6EBF3';
          ctx.lineWidth = 2;
          ctx.setLineDash([28 * U, 30 * U]);
          ctx.lineDashOffset = -laneOff;
          [0.25, 0.5, 0.75].forEach(function (f) { ctx.beginPath(); ctx.moveTo(W * f, -60); ctx.lineTo(W * f, H + 60); ctx.stroke(); });
          ctx.setLineDash([]);
          ctx.strokeStyle = '#D5DDE9';
          ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(6, H); ctx.moveTo(W - 6, 0); ctx.lineTo(W - 6, H); ctx.stroke();
        }

        function drawJet() {
          ctx.save();
          ctx.translate(jet.x, jet.y);
          ctx.rotate(jet.tilt);
          ctx.scale(U, U);
          ctx.lineJoin = 'round';
          // engine flame
          var f = 8 + Math.random() * 9;
          ctx.beginPath(); ctx.moveTo(-5, 33); ctx.lineTo(0, 33 + f); ctx.lineTo(5, 33); ctx.closePath();
          ctx.fillStyle = '#FFB020'; ctx.fill();
          // body
          ctx.beginPath();
          ctx.moveTo(0, -30); ctx.lineTo(7, -12); ctx.lineTo(10, 2); ctx.lineTo(34, 24); ctx.lineTo(34, 30);
          ctx.lineTo(10, 26); ctx.lineTo(7, 36); ctx.lineTo(0, 33); ctx.lineTo(-7, 36); ctx.lineTo(-10, 26);
          ctx.lineTo(-34, 30); ctx.lineTo(-34, 24); ctx.lineTo(-10, 2); ctx.lineTo(-7, -12); ctx.closePath();
          ctx.fillStyle = BLUE;
          ctx.shadowColor = 'rgba(26,115,232,0.35)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
          ctx.fill();
          ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
          // canopy
          ctx.beginPath(); ctx.ellipse(0, -12, 3.6, 7, 0, 0, 6.283);
          ctx.fillStyle = '#0B4FB3'; ctx.fill();
          // brand name on the wings
          ctx.font = '700 7.5px ' + FONT;
          ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(BRAND, 0, 17);
          ctx.restore();
        }

        function rr(x, y, w, h, r) {
          r = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        function brandText(cx, cy, avail, fs, rot) {
          if (avail < 40 * U) return;
          ctx.font = '700 ' + fs + 'px ' + FONT;
          var mw = ctx.measureText(BRAND).width;
          if (mw > avail) { fs *= avail / mw; ctx.font = '700 ' + fs + 'px ' + FONT; }
          ctx.save();
          ctx.translate(cx, cy);
          if (rot) ctx.rotate(rot);
          ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(BRAND, 0, 1);
          ctx.restore();
        }

        function drawObs() {
          for (var i = 0; i < obs.length; i++) {
            var o = obs[i];
            if (o.kind === 'spin') {
              ctx.save();
              ctx.translate(o.x, o.y); ctx.rotate(o.ang);
              rr(-o.len / 2, -o.th / 2, o.len, o.th, o.th / 2);
              ctx.fillStyle = WALL; ctx.fill();
              ctx.fillStyle = AMBER;
              [-1, 1].forEach(function (sg) {
                ctx.beginPath(); ctx.arc(sg * (o.len / 2 - o.th / 2), 0, o.th * 0.3, 0, 6.283); ctx.fill();
              });
              brandText(0, 0, o.len - o.th * 2 - 12 * U, o.th * 0.5, 0);
              ctx.restore();
              continue;
            }
            for (var s = 0; s < o.segs.length; s++) {
              var g = o.segs[s];
              var sy = o.y + (g.dy || 0), sh = g.h || o.h;
              rr(g.x, sy, g.w, sh, (g.nolabel ? 5 : 7) * U);
              ctx.fillStyle = o.color || WALL; ctx.fill();
              if (g.nolabel) continue;
              if (g.vert) {
                brandText(g.x + g.w / 2, sy + sh / 2, sh - 18 * U, g.w * 0.4, -Math.PI / 2);
              } else {
                var x0 = Math.max(g.x, 0), x1 = Math.min(g.x + g.w, W);
                brandText((x0 + x1) / 2, sy + sh / 2, (x1 - x0) - 18 * U, sh * 0.46, 0);
              }
            }
          }
        }

        function text(str, x, y, size, color, weight) {
          ctx.font = (weight || 700) + ' ' + size * U + 'px ' + FONT;
          ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(str, x, y);
        }

        function draw() {
          drawBg();
          drawObs();
          if (state !== 'over') drawJet();
          for (var i = 0; i < parts.length; i++) {
            var q = parts[i];
            ctx.strokeStyle = q.c; ctx.globalAlpha = clamp(q.life * 1.6, 0, 1); ctx.lineWidth = 2.5; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 0.05, q.y - q.vy * 0.05); ctx.stroke();
          }
          ctx.globalAlpha = 1;
          var cx = W / 2;
          if (state === 'play') {
            text(String(score), cx, 84, 28, INK);
            text('Best ' + best, cx, 84 + 24 * U, 12, MUTED, 600);
          } else if (state === 'ready') {
            text('No internet connection', cx, H * 0.28, 24, INK);
            text('Check your connection and try again.', cx, H * 0.28 + 30 * U, 13, MUTED, 500);
            text(fine ? 'Press Space or tap to start' : 'Tap to start', cx, H * 0.46, 16, BLUE);
            text(fine ? 'Steer with the arrow keys or drag' : 'Drag to steer', cx, H * 0.46 + 26 * U, 12, MUTED, 500);
            if (best) text('Best score ' + best, cx, H * 0.46 + 52 * U, 12, MUTED, 600);
          } else {
            text('Game over', cx, H * 0.34, 28, INK);
            text('Score ' + score, cx, H * 0.34 + 38 * U, 20, BLUE);
            text(newBest ? 'New best score' : 'Best score ' + best, cx, H * 0.34 + 66 * U, 13, newBest ? '#1E8E3E' : MUTED, 600);
            text(fine ? 'Press Space or tap to play again' : 'Tap to play again', cx, H * 0.34 + 104 * U, 15, BLUE);
          }
        }

        var last = 0;
        function frame(ts) {
          var dt = Math.min(0.05, (ts - last) / 1000 || 0);
          last = ts;
          update(dt);
          draw();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        // ---- input ----
        function begin() {
          if (state === 'ready') { reset(); return true; }
          if (state === 'over') { if (performance.now() - overAt < 450) return false; reset(); return true; }
          return true;
        }
        cv.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          if (!begin()) return;
          down = true;
          grab = jet.x - e.clientX;
          try { cv.setPointerCapture(e.pointerId); } catch (err) {}
        });
        cv.addEventListener('pointermove', function (e) { if (down && state === 'play') target = e.clientX + grab; });
        ['pointerup', 'pointercancel'].forEach(function (n) { cv.addEventListener(n, function () { down = false; }); });
        cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

        var kl = false, kr = false;
        function setKey(e, v) {
          var k = (e.key || '').toLowerCase();
          if (k === 'arrowleft' || k === 'a') kl = v;
          else if (k === 'arrowright' || k === 'd') kr = v;
          else return false;
          keyDir = (kr ? 1 : 0) - (kl ? 1 : 0);
          return true;
        }
        window.addEventListener('keydown', function (e) {
          if (setKey(e, true)) {
            e.preventDefault();
            if (!e.repeat && state !== 'play') begin();
          } else if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            if (!e.repeat) begin();
          }
        });
        window.addEventListener('keyup', function (e) { if (setKey(e, false)) e.preventDefault(); });
        window.addEventListener('blur', function () { kl = kr = false; keyDir = 0; });
        window.focus();

        // ---- top bar: status + retry/close ----
        act.textContent = embed ? 'Close' : 'Retry';
        act.addEventListener('click', function () {
          if (embed) window.parent.postMessage({ type: 'jc-offline-close' }, '*');
          else location.reload();
        });
        window.addEventListener('online', function () {
          pill.classList.add('on'); ptxt.textContent = 'Back online';
          act.classList.add('on'); act.textContent = embed ? 'Close' : 'Reload';
        });
        window.addEventListener('offline', function () {
          pill.classList.remove('on'); ptxt.textContent = 'Offline';
          act.classList.remove('on'); act.textContent = embed ? 'Close' : 'Retry';
        });
      })();
    </script>
  </body>
</html>
