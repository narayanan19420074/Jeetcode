<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#CFE0FB" />
    <title>JeetCode — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: Inter, system-ui, sans-serif; background: #F5F8FE; color: #1F2328; text-align: center; }
      .card { max-width: 340px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.3rem; margin: 16px 0 6px; }
      p { margin: 0 0 20px; color: #5C6675; line-height: 1.5; }
      button { border: 0; border-radius: 999px; padding: 12px 28px; font-weight: 700; font-size: 1rem; color: #fff; background: #1A73E8; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>JeetCode needs internet to load problems and run code. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
