# Render Blueprint — ONE free web service that runs the API AND serves the
# built React client (same origin => no CORS / cookie headaches).
# Put this file at the ROOT of your repo (next to /client and /server).
services:
  - type: web
    name: jeetcode            # URL becomes https://jeetcode.onrender.com (if the name is free)
    runtime: node
    plan: free
    region: singapore         # closest free region to India
    branch: feature/aptitude  # <-- CHANGE THIS to the git branch you want deployed
    autoDeploy: true          # every push to that branch redeploys

    # Runs from the repo root. --include=dev is REQUIRED: Render sets
    # NODE_ENV=production, which would otherwise skip devDependencies (vite).
    buildCommand: npm --prefix client ci --include=dev && npm --prefix client run build && npm --prefix server ci
    startCommand: npm --prefix server start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED        # seeds problems + aptitude questions when server/content/ changes
        value: "true"
      - key: SERVE_CLIENT     # makes Express serve client/dist
        value: "true"
      - key: VITE_API_BASE_URL  # baked into the client at build time
        value: /api
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      # Code execution runs in the separate, isolated "jeetcode-judge" service below.
      # Set JUDGE_SERVICE_URL (https://<judge-service-name>.onrender.com) and
      # JUDGE_SERVICE_TOKEN (same value as on the judge service) in the Render dashboard.
      - key: JUDGE_MODE
        value: remote
      - key: JUDGE_SERVICE_URL
        sync: false
      - key: JUDGE_SERVICE_TOKEN
        sync: false
      - key: JUDGE0_API_URL
        value: https://ce.judge0.com
      - key: MONGODB_URI      # Render will ask you for this when you apply the Blueprint
        sync: false

  # Isolated code-execution service. No database or auth secrets live here.
  - type: web
    name: jeetcode-judge
    runtime: docker
    plan: free
    region: singapore
    branch: feature/aptitude  # keep in sync with the web service above
    autoDeploy: true
    dockerfilePath: ./server/judge/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: JUDGE_SERVICE_TOKEN   # a long random string, identical to the web service's value
        sync: false
      - key: JUDGE_CONCURRENCY     # free instances have 512 MB of RAM
        value: "1"
      - key: JUDGE_MEMORY_MB
        value: "256"
